name: Update Last Modified Timestamp and Convert to PDF

on:
  push:
    paths:
      - '**/*.md'

jobs:
  update-timestamp-and-convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Update the LastEdited tag
      - name: Update LastEdited Tag
        run: |
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "Current time is: $CURRENT_TIME"

          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep '\.md$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Markdown files were modified."
            exit 0
          fi

          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              echo "Updating timestamp in $file"
              perl -0777 -pi -e "s/(<!-- LastEdited -->).*?(<!-- \/LastEdited -->)/\$1\nLast Edited: $CURRENT_TIME\n\$2/sg" "$file"
            fi
          done

      # 2. Setup Pandoc for PDF generation
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install PDF Engine (LaTeX)
        run: sudo apt-get update && sudo apt-get install -y texlive-xetex librsvg2-bin        

      # 3. Convert the Markdown files to PDF
      - name: Convert Updated Markdown to PDF
        run: |
          files=$(git diff --name-only | grep '\.md$' || true)
          
          if [ -z "$files" ]; then
            files=$(find . -name "*.md")
          fi

          for file in $files; do
            if [ -f "$file" ]; then
              output="${file%.md}.pdf"
              echo "Converting $file -> $output..."
              pandoc "$file" -o "$output" \
                --pdf-engine=xelatex \
                -V mainfont="Liberation Sans" \
                -V geometry:margin=1in \
                -V colorlinks=true              
            fi
          done

      # 4. Explicitly stage all modified .md files and new/modified .pdf files
      - name: Stage changes
        run: |
          git add "**/*.md" "**/*.pdf"

      # 5. Commit and push updates safely (skips gracefully if nothing changed)
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore: update LastEdited timestamp and convert to PDF [skip ci]"
          git push
